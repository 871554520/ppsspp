name: Probe macOS labels
on:
  workflow_dispatch: {}
jobs:
  macos_latest:
    runs-on: macos-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - run: |
          sw_vers; xcodebuild -version
